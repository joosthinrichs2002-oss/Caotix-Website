<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="noindex,nofollow,noarchive" name="robots"/>
<title>CAOTIX</title>
<link href="../style.css" rel="stylesheet"/><link href="../easter-eggs/easter-eggs.css" rel="stylesheet"/>
</head>
<body class="signal-page signal-page-v32">
<main aria-label="Verstecktes Signal" class="signal-scene">
<img alt="" class="signal-room-art" src="../easter-eggs/assets/easteregg-fear-to-die-room.webp"/>
<div aria-label="Röhrenfernseher mit flackerndem Datum" class="signal-tv-screen">
<div class="signal-tv-noise"></div>
<div class="signal-date">XX.XX.XXXX</div>
</div>
<div class="signal-vignette"></div>
</main>
<script src="../easter-eggs/observer.js"></script><script src="../content.js"></script><script>
  (() => {
    const scene = document.querySelector('.signal-scene');
    const art = document.querySelector('.signal-room-art');
    const screen = document.querySelector('.signal-tv-screen');
    if (!scene || !art || !screen) return;

    const signal = window.CAOTIX_CONTENT?.aux || {};
    const dateEl = document.querySelector('.signal-date');
    if (dateEl) {
      if (signal.mode === 'countdown' && signal.targetDate) {
        const target = new Date(signal.targetDate);
        const paintCountdown = () => {
          const ms = target - new Date();
          if (ms <= 0) { dateEl.textContent = 'NOW'; return; }
          const d = Math.floor(ms / 86400000);
          const h = Math.floor((ms % 86400000) / 3600000);
          const m = Math.floor((ms % 3600000) / 60000);
          const sec = Math.floor((ms % 60000) / 1000);
          dateEl.textContent = `${String(d).padStart(2,'0')}D ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
        };
        paintCountdown();
        setInterval(paintCountdown, 1000);
      } else {
        dateEl.textContent = signal.displayText || 'XX.XX.XXXX';
      }
    }

    
    const source = { w: 1536, h: 1024, x: 333, y: 401, sw: 154, sh: 108 };

    function placeScreen() {
      const vw = scene.clientWidth;
      const vh = scene.clientHeight;
      const scale = Math.max(vw / source.w, vh / source.h);
      const rw = source.w * scale;
      const rh = source.h * scale;
      const ox = (vw - rw) / 2;
      const oy = (vh - rh) / 2;

      screen.style.left = (ox + source.x * scale) + 'px';
      screen.style.top = (oy + source.y * scale) + 'px';
      screen.style.width = (source.sw * scale) + 'px';
      screen.style.height = (source.sh * scale) + 'px';
    }

    const ready = () => requestAnimationFrame(placeScreen);
    if (art.complete) ready();
    else art.addEventListener('load', ready, {once:true});
    window.addEventListener('resize', placeScreen, {passive:true});
  })();
  </script>
</body>
</html>
